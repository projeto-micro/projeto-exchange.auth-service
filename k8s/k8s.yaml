apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-configmap
  labels:
    app: auth
data:
  JWT_HTTP_ONLY: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  labels:
    app: auth
type: Opaque
stringData:
  JWT_SECRET_KEY: "jYCiN0YPiaBP53bGJi/kjfw79HW7xnBu9UPoD/QFFAE="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: projetomicro/auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: auth-configmap
            - secretRef:
                name: auth-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app: auth
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: auth
